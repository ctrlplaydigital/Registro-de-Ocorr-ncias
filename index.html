<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de ocorrências</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f3; --card: #ffffff; --ink: #1b2a2f; --muted: #5d6f75;
    --line: #cfd8dc; --accent: #1f5f55; --accent-ink: #ffffff; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11191c; --card: #19252a; --ink: #e6eef0; --muted: #94a8ae;
            --line: #2f4147; --accent: #4fb3a2; --accent-ink: #08201c; --err: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 "Schibsted Grotesk", system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.75rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
         padding: 24px; display: grid; gap: 20px; }
  label, legend { font-weight: 500; font-size: .95rem; display: block; margin-bottom: 6px; }
  select, input[type=date], textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  textarea { min-height: 120px; resize: vertical; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  fieldset { border: 0; padding: 0; margin: 0; }
  .grav { display: flex; flex-wrap: wrap; gap: 8px; }
  .grav label { margin: 0; font-weight: 400; }
  .grav input { position: absolute; opacity: 0; }
  .grav span { display: inline-block; padding: 8px 14px; border: 1px solid var(--line);
               border-radius: 999px; cursor: pointer; background: var(--bg); }
  .grav input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
  .grav input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
  button { font: inherit; font-weight: 700; background: var(--accent); color: var(--accent-ink);
           border: 0; border-radius: 6px; padding: 12px 20px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  #msg { min-height: 1.5em; margin: 0; font-weight: 500; }
  #msg.erro { color: var(--err); }
  #msg.ok { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Registro de ocorrências</h1>
  <p class="sub">Preencha os dados e salve. O registro vai direto para a planilha.</p>

  <form id="f" novalidate>
    <div>
      <label for="professor">Professor</label>
      <select id="professor" required><option value="">Carregando…</option></select>
    </div>
    <div>
      <label for="data">Data da ocorrência</label>
      <input type="date" id="data" required>
    </div>
    <div>
      <label for="motivo">Motivo</label>
      <select id="motivo" required><option value="">Carregando…</option></select>
    </div>
    <div>
      <label for="descricao">Descrição</label>
      <textarea id="descricao" required placeholder="Descreva o que aconteceu"></textarea>
    </div>
    <fieldset>
      <legend>Gravidade</legend>
      <div class="grav" id="gravidade"></div>
    </fieldset>
    <p id="msg" role="status"></p>
    <button type="submit" id="salvar" disabled>Salvar ocorrência</button>
  </form>
</main>

<script>
// Cole aqui a URL do app da web gerada no Apps Script (termina em /exec)
const API_URL = "https://script.google.com/macros/s/AKfycbyFd2qPcR4gba5X0Y8DsLiYloRuD8OeaDu86tR_RmJvYivPWRHBWSTj4PTHSiEq5-UQ/exec";

const $ = id => document.getElementById(id);
const msg = (t, c = "") => { $("msg").textContent = t; $("msg").className = c; };

function hoje() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}

function preencher(select, itens, rotulo) {
  select.innerHTML = "";
  select.add(new Option(rotulo, ""));
  itens.forEach(i => select.add(new Option(i, i)));
}

async function carregar() {
  try {
    const r = await fetch(API_URL);
    const d = await r.json();
    if (!d.ok) throw new Error(d.erro);
    preencher($("professor"), d.professores, "Selecione o professor");
    preencher($("motivo"), d.motivos, "Selecione o motivo");
    $("gravidade").innerHTML = "";
    d.gravidades.forEach(g => {
      const l = document.createElement("label");
      const i = document.createElement("input");
      i.type = "radio"; i.name = "gravidade"; i.value = g;
      const s = document.createElement("span"); s.textContent = g;
      l.append(i, s); $("gravidade").append(l);
    });
    $("salvar").disabled = false;
    msg("");
  } catch (e) {
    msg("Não foi possível carregar as listas da planilha. Verifique a URL e a implantação do Apps Script.", "erro");
  }
}

$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const grav = document.querySelector("input[name=gravidade]:checked");
  const dados = {
    professor: $("professor").value, data: $("data").value, motivo: $("motivo").value,
    descricao: $("descricao").value.trim(), gravidade: grav ? grav.value : ""
  };
  if (!dados.professor || !dados.data || !dados.motivo || !dados.descricao || !dados.gravidade) {
    return msg("Preencha todos os campos, incluindo a gravidade.", "erro");
  }
  $("salvar").disabled = true; msg("Salvando…");
  try {
    // text/plain evita a pré-verificação CORS, que o Apps Script não responde
    const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(dados) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.erro);
    $("f").reset(); $("data").value = hoje();
    msg("Ocorrência salva.", "ok");
  } catch (e) {
    msg("Não foi possível salvar. Tente novamente.", "erro");
  } finally { $("salvar").disabled = false; }
});

$("data").value = hoje();
carregar();
</script>
</body>
</html>
