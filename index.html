<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo: #eef1f6; --papel: #ffffff; --tinta: #141b2d; --suave: #5b6478;
    --linha: #d5dae5; --acento: #2447e0; --acento-escuro: #1a35b3;
    --leve: #1f7a4d; --leve-bg: #e0f3e8;
    --media: #8a5a00; --media-bg: #fdefc9;
    --grave: #a31f2e; --grave-bg: #fbe0e3;
    --erro: #a31f2e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--tinta);
         font: 16px/1.45 'IBM Plex Sans', system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 4px; }
  .sub { margin: 0 0 20px; color: var(--suave); }
  form { background: var(--papel); border: 1px solid var(--linha); border-radius: 10px;
         padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 16px; }
  .campo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .cheio { grid-column: 1 / -1; }
  label { font-size: .875rem; font-weight: 500; }
  .obr::after { content: ' *'; color: var(--erro); }
  input, select, textarea { font: inherit; color: inherit; width: 100%; padding: 10px 12px;
         background: #fff; border: 1px solid var(--linha); border-radius: 6px; }
  textarea { min-height: 120px; resize: vertical; }
  input[readonly] { background: #f4f6fa; color: var(--suave); }
  select:disabled { background: #f4f6fa; color: #9aa3b5; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 3px solid rgba(36,71,224,.35); outline-offset: 1px; border-color: var(--acento); }
  .classif { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; }
  .etiqueta { padding: 5px 14px; border-radius: 999px; font-weight: 600; font-size: .9rem;
              background: #f4f6fa; color: var(--suave); }
  .etiqueta.LEVE  { background: var(--leve-bg);  color: var(--leve); }
  .etiqueta.MEDIA { background: var(--media-bg); color: var(--media); }
  .etiqueta.GRAVE { background: var(--grave-bg); color: var(--grave); }
  .acoes { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; padding: 11px 22px; border: 0; border-radius: 6px;
           background: var(--acento); color: #fff; cursor: pointer; }
  button:hover { background: var(--acento-escuro); }
  button:disabled { opacity: .6; cursor: wait; }
  #msg { font-weight: 500; }
  #msg.ok { color: var(--leve); } #msg.erro { color: var(--erro); }
  @media (max-width: 600px) { form { grid-template-columns: 1fr; padding: 18px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1 id="titulo">Registro de ocorrência</h1>
  <p class="sub">Campos com * são obrigatórios.</p>
  <form id="form" novalidate></form>
</main>

<script>
  // Cole aqui a URL do app da Web gerada pelo Apps Script (termina em /exec)
  var API_URL = 'COLE_AQUI_A_URL_DO_APPS_SCRIPT';

  var CFG = null, TABELA = [], ELEM = {};

  fetch(API_URL)
    .then(function (r) { return r.json(); })
    .then(function (cfg) {
      if (cfg.ok === false) throw new Error(cfg.erro);
      iniciar(cfg);
    })
    .catch(function (e) { mostrarMsg('Não foi possível carregar o formulário. ' + (e.message || ''), 'erro'); });

  function el(tag, attrs, filhos) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'texto') n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]);
    });
    (filhos || []).forEach(function (f) { n.appendChild(f); });
    return n;
  }

  function iniciar(cfg) {
    CFG = cfg; TABELA = cfg.classificacao;
    document.getElementById('titulo').textContent = cfg.titulo;
    var form = document.getElementById('form');
    var campos = cfg.campos;
    var campoClassif = campos.filter(function (c) { return c.tipo === 'classificacao'; })[0];

    campos.forEach(function (c) {
      if (c.tipo === 'classificacao') return;       // renderizada junto do motivo
      form.appendChild(criarCampo(c));
      if (c.chave === 'motivo' && campoClassif) form.appendChild(criarClassificacao(campoClassif));
    });

    var botao = el('button', { type: 'submit', id: 'enviar', texto: 'Registrar ocorrência' });
    var msg = el('span', { id: 'msg', role: 'status', 'aria-live': 'polite' });
    form.appendChild(el('div', { 'class': 'campo cheio acoes' }, [botao, msg]));
    form.addEventListener('submit', enviar);

    if (ELEM.data && ELEM.dia_semana) {
      ELEM.data.addEventListener('change', atualizarDia);
    }
    atualizarCascata();
  }

  function criarCampo(c) {
    var id = 'f_' + c.chave, controle;
    var cheio = c.tipo === 'textarea' || c.tipo === 'cascata';
    if (c.tipo === 'textarea') controle = el('textarea', { id: id });
    else if (c.tipo === 'cascata' || c.tipo === 'selecao') {
      controle = el('select', { id: id });
      if (c.tipo === 'selecao') preencher(controle, c.opcoes || [], 'Selecione…');
      else controle.addEventListener('change', atualizarCascata);
    } else {
      var tipos = { texto: 'text', data: 'date', hora: 'time', email: 'email', dia_semana: 'text' };
      controle = el('input', { id: id, type: tipos[c.tipo] || 'text', autocomplete: 'off' });
      if (c.tipo === 'dia_semana') { controle.readOnly = true; controle.placeholder = 'Preenchido pela data'; }
    }
    ELEM[c.chave] = controle;
    var rotulo = el('label', { 'for': id, texto: c.rotulo });
    if (c.obrigatorio) rotulo.className = 'obr';
    return el('div', { 'class': 'campo' + (cheio ? ' cheio' : '') }, [rotulo, controle]);
  }

  function criarClassificacao(c) {
    var tag = el('span', { 'class': 'etiqueta', texto: 'Definida pelo motivo' });
    ELEM.classificacao = tag;
    return el('div', { 'class': 'campo' }, [
      el('span', { 'class': 'rotulo-fake', texto: c.rotulo, style: 'font-size:.875rem;font-weight:500' }),
      el('div', { 'class': 'classif' }, [tag])
    ]);
  }

  function preencher(select, valores, placeholder) {
    select.textContent = '';
    select.appendChild(el('option', { value: '', texto: placeholder }));
    valores.forEach(function (v) { select.appendChild(el('option', { value: v, texto: v })); });
  }

  function unicos(lista) {
    var vistos = {}; return lista.filter(function (v) { return vistos[v] ? false : (vistos[v] = true); });
  }

  function atualizarCascata() {
    var tipo = ELEM.tipo, assunto = ELEM.assunto, motivo = ELEM.motivo;
    if (!tipo || !assunto || !motivo) return;

    if (!tipo.options.length) {
      preencher(tipo, unicos(TABELA.map(function (r) { return r.tipo; })), 'Selecione o tipo…');
    }
    var t = tipo.value, a = assunto.value;

    var assuntos = unicos(TABELA.filter(function (r) { return r.tipo === t; }).map(function (r) { return r.assunto; }));
    if (!assuntos.includes(a)) a = '';
    preencher(assunto, assuntos, t ? 'Selecione o assunto…' : 'Escolha o tipo antes');
    assunto.value = a; assunto.disabled = !t;

    var motivos = unicos(TABELA.filter(function (r) { return r.tipo === t && r.assunto === a; }).map(function (r) { return r.motivo; }));
    var m = motivo.value; if (!motivos.includes(m)) m = '';
    preencher(motivo, motivos, a ? 'Selecione o motivo…' : 'Escolha o assunto antes');
    motivo.value = m; motivo.disabled = !a;
    motivo.onchange = atualizarClassificacao;
    atualizarClassificacao();
  }

  function classificacaoAtual() {
    var r = TABELA.filter(function (x) {
      return x.tipo === ELEM.tipo.value && x.assunto === ELEM.assunto.value && x.motivo === ELEM.motivo.value;
    })[0];
    return r ? r.classificacao : '';
  }

  function atualizarClassificacao() {
    if (!ELEM.classificacao) return;
    var c = classificacaoAtual();
    ELEM.classificacao.textContent = c || 'Definida pelo motivo';
    ELEM.classificacao.className = 'etiqueta' + (c ? ' ' + c.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase() : '');
  }

  var DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  function atualizarDia() {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ELEM.data.value);
    ELEM.dia_semana.value = m ? DIAS[new Date(+m[1], +m[2] - 1, +m[3]).getDay()] : '';
  }

  function mostrarMsg(texto, tipo) {
    var m = document.getElementById('msg') || document.querySelector('.sub');
    m.textContent = texto; m.className = tipo || '';
  }

  function enviar(ev) {
    ev.preventDefault();
    var dados = {}, falta = null;
    CFG.campos.forEach(function (c) {
      var e = ELEM[c.chave];
      if (!e || c.tipo === 'classificacao') return;
      dados[c.chave] = e.value;
      if (c.obrigatorio && !String(e.value).trim() && !falta) falta = c;
    });
    if (falta) { mostrarMsg('Preencha o campo "' + falta.rotulo + '".', 'erro'); ELEM[falta.chave].focus(); return; }

    var botao = document.getElementById('enviar');
    botao.disabled = true; mostrarMsg('Salvando…', '');
    // text/plain evita a pré-verificação (CORS) que o Apps Script não responde
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(dados)
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.erro || 'Não foi possível salvar.');
        CFG.campos.forEach(function (c) {
          var e = ELEM[c.chave];
          if (e && c.tipo !== 'classificacao' && !c.manter) e.value = '';
        });
        atualizarCascata(); botao.disabled = false;
        mostrarMsg('Ocorrência registrada.', 'ok');
      })
      .catch(function (e) {
        botao.disabled = false; mostrarMsg(e.message || 'Não foi possível salvar.', 'erro');
      });
  }
</script>
</body>
</html>
