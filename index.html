<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de Ocorrências</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #171923; --card: #1e2231; --field: #313548; --line: #2b3042;
    --blue: #4dabf7; --ink: #ffffff; --muted: #8b93ab; --req: #ff6b81; --err: #ff8a80;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 "Inter", system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 12px 12px 64px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 40px 36px 36px; }
  h1 { margin: 0; text-align: center; color: var(--blue); font-size: 1.9rem; font-weight: 700; letter-spacing: -0.01em; }
  .rule { border: 0; border-top: 1px solid var(--blue); margin: 22px 0 14px; }
  .sub { text-align: center; color: var(--muted); font-size: .875rem; margin: 0 0 26px; }
  form { display: grid; gap: 20px; }
  label { display: block; margin-bottom: 7px; color: var(--blue); font-size: .75rem; font-weight: 600; }
  label .req { color: var(--req); }
  select, input[type=date], textarea {
    width: 100%; font: inherit; font-size: 1rem; font-weight: 500; color: var(--ink);
    background: var(--field); border: 1px solid transparent; border-radius: 6px; padding: 0 16px; height: 44px; }
  select { cursor: pointer; padding-right: 12px; }
  input[type=date] { cursor: pointer; }
  /* o ícone de calendário continua funcionando, mas o campo todo é clicável */
  input[type=date]::-webkit-calendar-picker-indicator { cursor: pointer; }
  textarea { height: auto; min-height: 130px; padding: 12px 16px; resize: vertical; font-weight: 400; }
  textarea::placeholder { color: var(--muted); }
  select:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 2px; }
  button { margin-top: 4px; height: 46px; font: inherit; font-weight: 600; color: #08141f;
           background: var(--blue); border: 0; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .ver { display: flex; align-items: center; justify-content: center; height: 46px; margin-top: 12px;
         color: var(--blue); background: transparent; border: 1px solid var(--blue); border-radius: 6px;
         font-weight: 600; text-decoration: none; }
  .ver[hidden] { display: none; }
  .ver:hover { background: rgba(77,171,247,.12); }
  .ver:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  #msg { min-height: 1.4em; margin: 0; font-size: .9rem; font-weight: 500; text-align: center; }
  #msg.erro { color: var(--err); }
  #msg.ok { color: #69db9c; }
  @media (max-width: 520px) { .card { padding: 28px 18px 24px; } h1 { font-size: 1.5rem; } }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Registro de Ocorrências</h1>
    <hr class="rule">
    <p class="sub">Registre a ocorrência do professor. A data vem com o dia de hoje, mas você pode alterá-la.</p>

    <form id="f" novalidate>
      <div>
        <label for="professor">Professor <span class="req">*</span></label>
        <select id="professor" required><option value="">Carregando...</option></select>
      </div>
      <div>
        <label for="data">Data da ocorrência <span class="req">*</span></label>
        <input type="date" id="data" required>
      </div>
      <div>
        <label for="motivo">Motivo <span class="req">*</span></label>
        <select id="motivo" required><option value="">Carregando...</option></select>
      </div>
      <div>
        <label for="descricao">Descrição <span class="req">*</span></label>
        <textarea id="descricao" required placeholder="Descreva o que aconteceu"></textarea>
      </div>
      <div>
        <label for="gravidade">Gravidade <span class="req">*</span></label>
        <select id="gravidade" required><option value="">Carregando...</option></select>
      </div>
      <p id="msg" role="status"></p>
      <button type="submit" id="salvar" disabled>Salvar ocorrência</button>
    </form>
    <a class="ver" id="ver" href="#" target="_blank" rel="noopener">Abrir planilha de ocorrências</a>
  </div>
</main>

<script>
// Cole aqui a URL do app da web gerada no Apps Script (termina em /exec)
const API_URL = "https://script.google.com/macros/s/AKfycby2qylNAOZi-PVPzg-vSOUfxZboXqcKUJghr6SwvmRELftmz9D0Puohxj6oYN8683O1/exec";

// Cole aqui o link da sua planilha do Google Planilhas (o botão só aparece depois disso)
const PLANILHA_URL = "https://docs.google.com/spreadsheets/d/1MMkx8_YzSmOOAqn_dFiKMVk9M6tZx-gmImzAuJzR7lo/edit?usp=sharing";

const $ = id => document.getElementById(id);
const msg = (t, c = "") => { $("msg").textContent = t; $("msg").className = c; };

function hoje() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}

function preencher(select, itens) {
  select.innerHTML = "";
  select.add(new Option("Selecione...", ""));
  itens.forEach(i => select.add(new Option(i, i)));
}

// Clicar em qualquer ponto do campo de data abre o calendário
$("data").addEventListener("click", e => {
  try { e.currentTarget.showPicker(); } catch (_) { /* navegador sem suporte: usa o ícone */ }
});

async function carregar() {
  try {
    const r = await fetch(API_URL);
    const d = await r.json();
    if (!d.ok) throw new Error(d.erro);
    const professores = [...d.professores].sort((a, b) => a.localeCompare(b, "pt-BR", { sensitivity: "base" }));
    preencher($("professor"), professores);
    preencher($("motivo"), d.motivos);
    preencher($("gravidade"), d.gravidades);
    $("salvar").disabled = false;
    msg("");
  } catch (e) {
    msg("Não foi possível carregar as listas da planilha. Verifique a URL e a implantação do Apps Script.", "erro");
  }
}

$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const dados = {
    professor: $("professor").value, data: $("data").value, motivo: $("motivo").value,
    descricao: $("descricao").value.trim(), gravidade: $("gravidade").value
  };
  if (!dados.professor || !dados.data || !dados.motivo || !dados.descricao || !dados.gravidade) {
    return msg("Preencha todos os campos.", "erro");
  }
  $("salvar").disabled = true; msg("Salvando...");
  try {
    // text/plain evita a pré-verificação CORS, que o Apps Script não responde
    const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(dados) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.erro);
    $("f").reset(); $("data").value = hoje();
    msg("Ocorrência salva.", "ok");
  } catch (e) {
    msg("Não foi possível salvar. Tente novamente.", "erro");
  } finally { $("salvar").disabled = false; }
});

if (PLANILHA_URL.startsWith("http")) {
  $("ver").href = PLANILHA_URL;
} else {
  $("ver").addEventListener("click", e => {
    e.preventDefault();
    msg("Falta colar o link da planilha na linha PLANILHA_URL do código.", "erro");
  });
}

$("data").value = hoje();
carregar();
</script>
</body>
</html>
